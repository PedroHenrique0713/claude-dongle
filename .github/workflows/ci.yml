name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          # actions/setup-python has no 3.9 build for Apple Silicon runners
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The tested modules are pure stdlib — PyQt6 is only needed by the UI,
      # which the ui-smoke job covers, so skip the deps here (--no-deps).
      - run: pip install pytest && pip install --no-deps -e .
      - run: python -m compileall claude_dongle tests
      - run: python -m pytest tests/ -v

  ui-smoke:
    # Builds the real PyQt6 UI offscreen and renders the README screenshots —
    # catches import errors and widget construction crashes in the UI layer.
    # Runs on all three OSes: the UI is where platform differences actually
    # bite (fonts, platform plugin, native notification path), and none of that
    # shows up in the stdlib-only tests above.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libglib2.0-0t64 libxkbcommon0 \
            libdbus-1-3 libfontconfig1
      - run: pip install .
      # the console script must at least start: catches a broken entry point
      - run: claude-dongle
      - run: python scripts/gen_screenshots.py
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.os }}
          path: docs/*.png
